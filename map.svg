<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" style="background-color:#f4f3f0;">
  
  <!-- 道路の網の目 -->
  <g stroke="#d2d0cd" stroke-width="1.5" fill="none">
    <path d="M0,100 L400,100 M0,200 L400,200 M0,300 L400,300 M0,400 L400,400 M0,500 L400,500"/>
    <path d="M50,0 L50,600 M150,0 L150,600 M250,0 L250,600 M350,0 L350,600"/>
  </g>
  <!-- 主な主要道路や路線 -->
  <g stroke-linecap="round" fill="none">
    <path d="M0,250 C150,250 200,80 400,80" stroke="#ff9e3d" stroke-width="10"/>
    <path d="M200,0 L200,600" stroke="#8cd211" stroke-width="5"/>
    <path d="M400,0 L0,500" stroke="#ffed4a" stroke-width="3"/>
  </g>
  <!-- 東京駅の駅舎ビルマーク -->
  <rect x="150" y="220" width="100" height="50" rx="8" fill="#b8d5f5" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="200" y="251" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">東京駅</text>
  <!-- 各周辺エリアの名前 -->
  <text x="280" y="110" font-family="sans-serif" font-size="11" fill="#7f8c8d" font-weight="bold">皇居周辺</text>
  <text x="70" y="330" font-family="sans-serif" font-size="11" fill="#7f8c8d" font-weight="bold">銀座方面</text>
  <text x="280" y="480" font-family="sans-serif" font-size="11" fill="#7f8c8d" font-weight="bold">日本橋方面</text>
  <!-- 中心スポットピンの赤い丸 -->
  <circle cx="200" cy="245" r="5" fill="#e74c3c"/>
</svg>
